<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>House of Agents — Workflow Builder</title>
<style>
  /* ---- design tokens: ClickHouse-style light theme (default) ---- */
  :root{
    --bg:#0d0f13;--panel:#14171d;--card:#181c24;--card2:#1e232d;
    --edge:#262b36;--edge2:#39404f;
    --fg:#e8eaf0;--muted:#98a0b3;--faint:#6d7489;
    --accent:#ffcc00;--accent-hover:#ffd83d;--accent-dim:rgba(255,204,0,.16);
    --yellow:#ffcc00;--yellow-soft:rgba(255,204,0,.12);
    --ok:#4ac26b;--err:#f4747f;--run:#d9a13e;--loop:#d9a13e;
    --well:#14161b;--grid-dot:#20242e;--warn-bg:#3a2f16;--warn-fg:#d9a13e;
    --btn:#1e232d;--btn-hover:#242a36;
    --on-accent:#111;
    --shadow-sm:0 1px 2px rgba(0,0,0,.35);
    --shadow-md:0 4px 16px rgba(0,0,0,.45);
    --shadow-lg:0 16px 48px rgba(0,0,0,.6);
    --sans:Inter,-apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --r-sm:6px;--r-md:8px;--r-lg:12px;
  }
  [data-theme="light"]{
    --bg:#ffffff;--panel:#fafbfc;--card:#ffffff;--card2:#f6f7f9;
    --edge:#e4e6ea;--edge2:#c9cdd4;
    --fg:#16181d;--muted:#5f6672;--faint:#9aa0ab;
    --accent:#0f1114;--accent-hover:#2a2e36;--accent-dim:rgba(255,204,0,.30);
    --yellow:#ffcc00;--yellow-soft:#fff8d6;
    --ok:#1a7f37;--err:#cf222e;--run:#9a6700;--loop:#9a6700;
    --well:#f6f8fa;--grid-dot:#e2e5ea;--warn-bg:#fff8d6;--warn-fg:#7a5b00;
    --btn:#ffffff;--btn-hover:#f2f3f5;
    --on-accent:#ffcc00;
    --sans:Inter,-apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --shadow-sm:0 1px 2px rgba(16,24,40,.06);
    --shadow-md:0 4px 16px rgba(16,24,40,.12);
    --shadow-lg:0 16px 48px rgba(16,24,40,.18);
    --r-sm:6px;--r-md:8px;--r-lg:12px;
  }
  *{box-sizing:border-box;}
  ::selection{background:var(--accent-dim);}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--edge2);border-radius:8px;border:3px solid transparent;background-clip:padding-box;}
  ::-webkit-scrollbar-track{background:transparent;}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 var(--sans);
    -webkit-font-smoothing:antialiased;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
  code,pre,.log,.diff{font-family:var(--mono);}

  /* ---- controls ---- */
  button{background:var(--btn);color:var(--fg);border:1px solid var(--edge);border-radius:var(--r-sm);
    padding:5px 12px;font:500 13px/1.45 var(--sans);cursor:pointer;transition:background .12s,border-color .12s;}
  button:hover{background:var(--btn-hover);border-color:var(--edge2);}
  button:active{transform:translateY(.5px);}
  button:disabled{opacity:.45;cursor:default;transform:none;}
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);}
  input,select,textarea{background:var(--panel);color:var(--fg);border:1px solid var(--edge);border-radius:var(--r-sm);
    padding:6px 10px;font:13px/1.5 var(--sans);width:100%;transition:border-color .12s;}
  input:hover,select:hover,textarea:hover{border-color:var(--edge2);}
  textarea{resize:vertical;}
  .danger{color:var(--err);}
  .danger:hover{border-color:rgba(244,116,127,.5);background:rgba(244,116,127,.08);}

  /* ---- chrome ---- */
  .appbar{display:flex;align-items:center;gap:16px;padding:0 18px;height:48px;flex:none;
    border-bottom:1px solid var(--edge);background:var(--panel);}
  .appbar h1{margin:0;font-size:14.5px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;}
  .seg{display:flex;background:var(--bg);border:1px solid var(--edge);border-radius:8px;padding:2px;gap:2px;}
  .seg button{border:0;border-radius:6px;padding:4px 16px;background:transparent;color:var(--muted);font-weight:500;}
  .seg button:hover{color:var(--fg);background:transparent;}
  .seg button.on{background:var(--card2);color:var(--fg);font-weight:600;box-shadow:var(--shadow-sm);}
  .grow{flex:1;}
  .wfbar{display:flex;align-items:center;gap:8px;padding:9px 18px;border-bottom:1px solid var(--edge);background:var(--bg);flex-wrap:wrap;}
  .wfbar select{width:auto;min-width:170px;}
  .wfbar .primary{background:var(--yellow);color:#111;font-weight:650;border-color:transparent;padding:6px 20px;}
  .wfbar .primary:hover{background:#f0c000;}
  .wfbar .sep{width:1px;height:20px;background:var(--edge);margin:0 4px;}
  .panes{flex:1;position:relative;min-height:0;}
  .pane{position:absolute;inset:0;display:none;overflow-y:auto;}
  .pane.on{display:block;}
  .wrap{max-width:none;margin:0 auto;padding:20px 26px 80px;}

  /* ---- forms & sections ---- */
  label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.06em;}
  label.inl{display:inline-flex;align-items:center;gap:7px;text-transform:none;letter-spacing:0;color:var(--fg);font-size:13px;font-weight:400;margin:0;cursor:pointer;}
  label.inl input{width:auto;accent-color:var(--accent);}
  input[type=checkbox]{accent-color:var(--accent);}
  .box{border:1px solid var(--edge);border-radius:var(--r-lg);padding:16px 18px;margin-bottom:16px;background:var(--panel);box-shadow:var(--shadow-sm);}
  .box h2{margin:0 0 4px;font-size:15px;font-weight:650;color:var(--fg);letter-spacing:-.01em;}
  .sub{color:var(--muted);font-size:12px;line-height:1.6;max-width:95ch;}
  .row2{display:flex;gap:12px;} .row2>div{flex:1;}

  /* ---- step editor & loops ---- */
  .step{border:1px solid var(--edge);border-radius:var(--r-md);padding:13px 14px;background:var(--card);position:relative;}
  .step .top{display:flex;align-items:center;gap:8px;}
  .step .num{width:24px;height:24px;border-radius:50%;background:var(--accent-dim);color:var(--accent);font-weight:650;display:flex;align-items:center;justify-content:center;font-size:11px;flex:none;}
  .step .nm{flex:1;font-weight:600;}
  .step .ag{width:140px;flex:none;}
  .step .btns{display:flex;gap:5px;flex:none;}
  .step .btns button{padding:3px 9px;font-size:11.5px;}
  .arrow{text-align:center;color:var(--faint);font-size:15px;line-height:1;margin:5px 0;}
  .loopnote{color:var(--loop);font-size:11.5px;margin-top:6px;}
  .addstep{width:100%;margin-top:10px;border-style:dashed;color:var(--muted);}
  .addstep:hover{color:var(--fg);}

  /* ---- canvas ---- */
  .canvas{position:relative;border:1px solid var(--edge);border-radius:var(--r-md);background:
    radial-gradient(circle, var(--grid-dot) 1px, transparent 1px);background-size:22px 22px;
    background-color:var(--panel);overflow:auto;resize:vertical;min-height:220px;}
  .canvas > svg{position:absolute;top:0;left:0;pointer-events:none;}
  .canvas > svg [data-edge],.canvas > svg [data-loopedge]{pointer-events:stroke;cursor:pointer;}
  .canvas > svg [data-edge]:hover,.canvas > svg [data-loopedge]:hover{stroke:var(--err);}
  .cnode{position:absolute;width:176px;height:48px;box-sizing:border-box;border:1px solid var(--edge2);border-radius:var(--r-md);
    background:var(--card2);padding:5px 9px;cursor:grab;user-select:none;box-shadow:var(--shadow-sm);transition:border-color .12s,box-shadow .12s;}
  .cnode:hover{border-color:var(--accent);box-shadow:var(--shadow-md);}
  .cnode:active{cursor:grabbing;}
  .cnode.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim),var(--shadow-md);}
  .cnode.conn{border-color:var(--run);border-style:dashed;}
  .cnode .cn-h{display:flex;align-items:center;gap:5px;}
  .cnode .cn-name{flex:1;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.005em;}
  .cnode .cn-h button{padding:0 5px;font-size:11px;line-height:17px;border-radius:5px;background:transparent;border-color:transparent;color:var(--muted);}
  .cnode .cn-h button:hover{color:var(--fg);background:var(--accent-dim);}
  .cnode .cn-sub{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
  .cnode .port{position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);width:13px;height:13px;border-radius:50%;
    background:var(--panel);border:1.5px solid var(--accent);cursor:crosshair;touch-action:none;transition:transform .12s;}
  .cnode .port:hover{background:var(--accent);transform:translateX(-50%) scale(1.25);}

  /* ---- run board ---- */
  .runsplit{display:flex;gap:14px;align-items:flex-start;}
  .runlist{width:290px;flex:none;position:sticky;top:0;}
  .runrow{border:1px solid var(--edge);border-radius:var(--r-md);background:var(--panel);padding:9px 11px;margin-bottom:7px;cursor:pointer;transition:border-color .12s;}
  .runrow:hover{border-color:var(--edge2);}
  .runrow.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-dim);}
  .runrow .rr1{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;}
  .runrow .rr2{display:flex;justify-content:space-between;color:var(--muted);font-size:10.5px;margin-top:3px;font-variant-numeric:tabular-nums;}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .dot.running{background:var(--run);animation:aispin 0s;box-shadow:0 0 0 3px rgba(217,161,62,.18);}
  .dot.completed{background:var(--ok);}.dot.error{background:var(--err);}.dot.gated{background:var(--run);}
  .dot.stopped,.dot.pend{background:var(--faint);}
  .rundetail{flex:1;min-width:0;}
  .strip{display:flex;gap:6px;padding:10px 12px;flex-wrap:wrap;}
  .schip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--edge);border-radius:999px;padding:3px 11px;font-size:11.5px;background:var(--card2);font-variant-numeric:tabular-nums;}
  .schip.running{border-color:var(--run);color:var(--run);}
  .schip.done{border-color:rgba(74,194,107,.45);color:var(--ok);}
  .schip.error{border-color:rgba(244,116,127,.5);color:var(--err);}
  .schip.blocked{color:var(--faint);}
  .kb{display:flex;gap:8px;padding:10px 12px;overflow-x:auto;}
  .kb .col{flex:1;min-width:120px;background:var(--bg);border:1px solid var(--edge);border-radius:var(--r-md);padding:8px;}
  .kb .col h4{margin:0 0 6px;font-size:10.5px;font-weight:650;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);}
  .kb .kcard{border:1px solid var(--edge);border-radius:var(--r-sm);background:var(--card2);padding:6px 9px;font-size:12px;margin-bottom:5px;box-shadow:var(--shadow-sm);}
  .kb .kcard .kmeta{color:var(--muted);font-size:10.5px;margin-top:2px;font-variant-numeric:tabular-nums;}

  /* ---- runs & schedules ---- */
  .empty{color:var(--muted);text-align:center;margin-top:80px;font-size:14px;}
  .card{border:1px solid var(--edge);border-radius:var(--r-md);margin:10px 0;overflow:hidden;background:var(--panel);box-shadow:var(--shadow-sm);}
  .card .h{padding:8px 12px;background:var(--card);display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600;}
  .badge2{font-size:10.5px;font-variant-numeric:tabular-nums;font-weight:600;padding:2.5px 9px;border-radius:999px;letter-spacing:.01em;white-space:nowrap;}
  .b-pend{background:var(--card2);color:var(--muted);}.b-run{background:rgba(217,161,62,.14);color:var(--run);}
  .b-ok{background:rgba(74,194,107,.13);color:var(--ok);}.b-err{background:rgba(244,116,127,.12);color:var(--err);}
  .wfhdr{color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--edge);margin:12px 0 6px;padding-bottom:5px;display:flex;justify-content:space-between;gap:8px;}
  .steps{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;}
  .stepchip{font-size:12px;padding:2px 9px;border-radius:var(--r-sm);border:1px solid var(--edge);color:var(--muted);}
  .stepchip.running{color:var(--run);border-color:rgba(217,161,62,.45);}
  .stepchip.done{color:var(--ok);border-color:rgba(74,194,107,.4);}
  .stepchip.error{color:var(--err);border-color:rgba(244,116,127,.4);}
  .log{max-height:170px;overflow:auto;padding:9px 13px;font-size:12px;line-height:1.65;color:var(--muted);white-space:pre-wrap;word-break:break-word;border-top:1px solid var(--edge);background:var(--bg);}
  .diff{max-height:300px;overflow:auto;padding:9px 13px;font-size:12px;line-height:1.55;white-space:pre;border-top:1px solid var(--edge);background:var(--bg);}
  .diff .add{color:var(--ok);}.diff .del{color:var(--err);}.diff .hdr{color:var(--accent);}
  .meta{padding:0 12px 8px;color:var(--muted);font-size:12px;}

  /* ---- overlays ---- */
  .modal{position:fixed;inset:0;background:rgba(5,6,9,.72);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:100;}
  .modal .mbox{background:var(--card);border:1px solid var(--edge2);border-radius:var(--r-lg);padding:20px;min-width:340px;max-width:72vw;max-height:84vh;overflow:auto;box-shadow:var(--shadow-lg);}
  .primary2{background:var(--yellow);color:#111;font-weight:600;border-color:transparent;padding:6px 16px;border-radius:var(--r-sm);}
  .primary2:hover{background:#f0c000;}
  .radios{display:flex;gap:16px;align-items:center;}
  .radios label{display:inline-flex;align-items:center;gap:6px;margin:0;font-size:12.5px;font-weight:400;color:var(--fg);text-transform:none;letter-spacing:0;cursor:pointer;}
  .radios input{width:auto;accent-color:var(--accent);}
  .autogrow{resize:none;overflow-y:hidden;}
  @keyframes aispin{to{transform:rotate(360deg)}}
  .aispin{display:inline-block;width:11px;height:11px;border:1.6px solid var(--edge2);border-top-color:var(--accent);border-radius:50%;animation:aispin .8s linear infinite;vertical-align:-1.5px;margin-right:6px;}
  .toasts{position:fixed;top:56px;right:16px;z-index:60;display:flex;flex-direction:column;gap:8px;max-width:340px;}
  .toast{background:var(--card2);border:1px solid var(--edge2);border-left:3px solid var(--accent);border-radius:var(--r-md);
    padding:9px 12px;font-size:12px;line-height:1.5;box-shadow:var(--shadow-md);transition:opacity .25s;}
  .toast.ok{border-left-color:var(--ok);}.toast.err{border-left-color:var(--err);}.toast.run{border-left-color:var(--run);}
</style>
</head>
<body>
<div class="appbar">
  <h1><svg width="21" height="21" viewBox="0 0 22 22" style="vertical-align:-4.5px;margin-right:8px">
    <rect width="22" height="22" rx="5" fill="#ffcc00"/>
    <path d="M4.6 9.6L11 4.6l6.4 5" fill="none" stroke="#131313" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="7.4" cy="13.4" r="1.9" fill="#131313"/>
    <circle cx="14.6" cy="13.4" r="1.9" fill="#131313"/>
    <path d="M9.3 13.4h3.4" stroke="#131313" stroke-width="1.6"/>
  </svg>House <span style="font-weight:400;color:var(--muted)">of</span> Agents</h1>
  <div class="seg" id="viewSeg">
    <button data-view="build" class="on">Build</button>
    <button data-view="runs">Runs</button>
    <button data-view="schedules">Schedules</button>
  </div>
  <div class="grow"></div>
  <span title="UI version — if features look missing, hard-refresh (Cmd+Shift+R)" style="font-size:10px;color:var(--faint);letter-spacing:.02em;margin-right:2px">v51</span>
  <button id="btnTheme" title="toggle light / dark theme"><svg width="14" height="14" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 2a6 6 0 010 12z" fill="currentColor"/></svg></button>
  <button id="btnSettings" title="Global settings"><svg width="14" height="14" viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"><path d="M1.5 4.5h13M1.5 11.5h13"/><circle cx="10.5" cy="4.5" r="2" fill="var(--panel)"/><circle cx="5.5" cy="11.5" r="2" fill="var(--panel)"/></svg></button>
</div>
<script>
  // theme before first paint (no flash)
  const _t = new URLSearchParams(location.search).get("theme") || localStorage.getItem("hoa_theme"); if (_t === "light") document.documentElement.dataset.theme = "light";
</script>
<div class="wfbar" id="wfbar"></div>
<div class="panes">
  <div class="pane on" id="buildPane"><div class="wrap" id="buildForm"></div></div>
  <div class="pane" id="runsPane"><div class="wrap" id="runsBody"><div class="empty">Press ▶ Run to execute the current workflow.</div></div></div>
  <div class="pane" id="schedPane"><div class="wrap" id="schedBody"></div></div>
</div>
<div class="toasts" id="toasts"></div>

<script>
let AGENTS = ["Claude", "OpenAI", "Gemini", "OpenCode"]; // fallback — replaced from config.toml via /agents
fetch("/agents").then(r => r.json()).then(d => { if (Array.isArray(d.agents) && d.agents.length) { AGENTS = d.agents; renderAll(); } }).catch(() => { });

// Setup health: surface broken prerequisites as a banner instead of cryptic run failures
fetch("/health").then(r => r.json()).then(h => {
  const issues = [];
  if (!h.binary_found) issues.push(`engine binary not found (${h.binary}) — run: cargo build --release`);
  else if (h.stale) issues.push("engine binary is older than src/ — run: cargo build --release (newer features are silently missing)");
  if (!h.config_found) issues.push("config.toml not found — run the terminal app once to create it");
  else if (!(h.agents || []).length) issues.push("config.toml has no [[agents]]");
  if (issues.length) {
    const b = document.createElement("div");
    b.style.cssText = "background:var(--warn-bg);color:var(--warn-fg);font-size:11px;padding:6px 16px;display:flex;gap:14px;align-items:center";
    b.innerHTML = `<span>⚠ ${issues.map(esc).join(" · ")}</span><button style="margin-left:auto;padding:1px 8px;font-size:10px">dismiss</button>`;
    b.querySelector("button").onclick = () => b.remove();
    document.querySelector(".appbar").after(b);
  }
}).catch(() => { });

document.getElementById("btnTheme").onclick = () => {
  const light = document.documentElement.dataset.theme === "light";
  if (light) delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = "light";
  localStorage.setItem("hoa_theme", light ? "dark" : "light");
};

// Desktop notifications for the moments that matter in a background tab
function notify(title, body) {
  try {
    if (!("Notification" in window) || document.hasFocus()) return;
    if (Notification.permission === "granted") new Notification("🏠 " + title, { body });
  } catch { }
}
// Suggestions only — you can type ANY model string your CLI/API accepts. Edit freely.
const MODEL_SUGGESTIONS = {
  Claude: ["claude-opus-4-8", "claude-sonnet-5", "claude-fable-5", "claude-haiku-4-5-20251001"],
  OpenAI: ["gpt-5.3-codex", "gpt-5.3"],
  Gemini: ["gemini-2.5-pro", "gemini-2.5-flash"],
  OpenCode: ["anthropic/claude-sonnet-4-5"],
};
const EFFORTS = ["low", "medium", "high", "xhigh", "max"];
const esc = s => (s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* -------- state: a workflow is a free-form DAG on a canvas -------- */
function pruneDeps(w) {
  const ids = new Set(w.steps.map(s => s.id));
  w.steps.forEach(s => { s.deps = (s.deps || []).filter(d => ids.has(d)); });
  w.loops = (w.loops || []).filter(l => ids.has(l.from) && ids.has(l.to));
}
function computeDepth(w) {
  // Longest-path depth from the roots — the execution layering the engine
  // and human gates use; layout on the canvas is free and separate.
  const depsOf = {}; w.steps.forEach(s => depsOf[s.id] = s.deps || []);
  const level = {};
  const depth = id => { if (level[id] != null) return level[id]; level[id] = 0; const ds = depsOf[id] || []; if (ds.length) level[id] = 1 + Math.max(...ds.map(depth)); return level[id]; };
  w.steps.forEach(s => depth(s.id));
  return level;
}
function reachesVia(w, from, target) {
  // true if `from` transitively depends on `target`
  const byId = {}; w.steps.forEach(s => byId[s.id] = s);
  const seen = new Set(); const stack = [from];
  while (stack.length) {
    const id = stack.pop(); if (seen.has(id)) continue; seen.add(id);
    if (id === target) return true;
    ((byId[id] || {}).deps || []).forEach(d => stack.push(d));
  }
  return false;
}
function ensurePositions(w) {
  // migrate: place unpositioned steps by execution depth
  if (w.steps.every(s => s.x != null)) return;
  const level = computeDepth(w);
  const rows = {};
  w.steps.forEach(s => {
    if (s.x != null) return;
    const lv = level[s.id] || 0;

    const p = w._preRewrite;
    if (p && typeof p === "object") {
      w.tasks = p.tasks;
      if (p.step) { const s = w.steps.find(x => x.id === p.step.id); if (s) { s.prompt = p.step.prompt; s.agent = p.step.agent; s.model = p.step.model; s.effort = p.step.effort; s.raw = p.step.raw; } }
    } else w.tasks = p;
    delete w._preRewrite; renderBuild();
  };

  buildForm.querySelectorAll(".step[data-i]").forEach(row => {
    const i = +row.dataset.i, s = w.steps[i];
    if (!s) return;
    row.querySelectorAll(".autogrow").forEach(el => autoGrow(el, +el.dataset.maxh || 99999));
    row.querySelectorAll("[data-k]").forEach(el => {
      el.oninput = () => {
        s[el.dataset.k] = el.value;
        if (el.classList.contains("autogrow")) autoGrow(el, +el.dataset.maxh || 99999);
        if (el.dataset.k === "name") {
          // live-patch the canvas node instead of re-rendering (which would
          // steal focus from the input on every keystroke)
          const cn = document.querySelector(`.cnode[data-node="${s.id}"] .cn-name`);
          if (cn) cn.textContent = s.name || ("Step " + s.id);
        }
      };
      // selects (agent) and finished text edits refresh the full view
      el.onchange = () => {
        const v = (el.dataset.k === "schema" || el.dataset.k === "inputSchema") ? el.value.trim() : el.value;
        s[el.dataset.k] = v;
        renderBuild();
      };
    });
    const fr = row.querySelector("[data-fresh]"); if (fr) fr.onchange = () => { s.fresh = fr.checked; };
    const rw = row.querySelector("[data-raw]"); if (rw) rw.onchange = () => { s.raw = rw.checked; };
    const cd = row.querySelector("[data-code]"); if (cd) cd.onchange = () => { s.code = cd.checked; if (cd.checked) { s.raw = false; s.fresh = false; s.model = ""; s.effort = ""; } renderBuild(); };
    const gt = row.querySelector("[data-gate]"); if (gt) gt.onchange = () => { s.gate = gt.checked; if (gt.checked && (w.loops || []).length) { w.loops = []; toast("loops removed — human gates and loops can't combine"); } renderBuild(); };
    row.querySelector('[data-act="del"]').onclick = () => { const id = s.id; w.steps.splice(i, 1); pruneDeps(w); if (w._selected === id) delete w._selected; if (!w.steps.length) w.steps.push({ id: w.nextId++, name: "Step 1", agent: "Claude", prompt: "", deps: [], x: 30, y: 24 }); renderBuild(); };
    row.querySelector('[data-act="opt"]').onclick = ev => optimizeStep(w, s, ev.target);
    const cbtn = row.querySelector('[data-act="ctr"]');
    if (cbtn) cbtn.onclick = async () => {
      // Scope = this step + its direct parents and children — the only steps
      // that determine its contracts. Parents fix what arrives; children fix
      // how the output is consumed. Nothing else goes along.
      const parents = (s.deps || []).map(d => w.steps.find(x => x.id === d)).filter(Boolean);
      const children = w.steps.filter(x => (x.deps || []).includes(s.id));
      const scopeIds = new Set([s.id, ...parents.map(p => p.id), ...children.map(c => c.id)]);
      const steps = [...parents, s, ...children].filter(x => !x.raw)
        .map(x => ({ id: x.id, name: x.name, prompt: x.prompt,
                     deps: (x.deps || []).filter(d => scopeIds.has(d)),
                     input: x.inputSchema || "", output: x.schema || "" }));
      try {
        const data = await aiTask("contracts",
          { steps, scoped: true, workdir: w.workdir, task: w.tasks, agent: assistAgent(), binary: settings.binary },
          `Designing contracts for "${s.name}" from its parents and children`);
        const v = data.steps[String(s.id)];
        if (v && (v.input || v.output)) {
          w._preContracts = w.steps.map(x => ({ id: x.id, schema: x.schema || "", inputSchema: x.inputSchema || "" }));
          if (v.output) s.schema = v.output;
          if (v.input) s.inputSchema = v.input;
          toast(`✦ contracts proposed for "${s.name}" — review before running`, "ok", 5000);
          renderBuild();
        } else toast("the agent proposed no contract for this step (free text may be right here)");
      } catch (e) { aiFail(e, "contracts"); }
    };
  });
  document.getElementById("addStep").onclick = () => {
    const id = w.nextId++;
    w.steps.push({ id, name: "Step " + id, agent: "Claude", prompt: "", deps: [], x: 30 + ((w.steps.length * 40) % 500), y: 24 + ((w.steps.length * 60) % 300) });
    w._selected = id;
    renderBuild();
  };

  // Canvas: drag to move; click to select; link button then a target to wire.
  const completeConnect = (fromId, toId) => {
    delete w._connectFrom;
    const byId = {}; w.steps.forEach(s => byId[s.id] = s);
    const a = byId[fromId], b = byId[toId];
    if (!a || !b) { renderBuild(); return; }
    if ((b.deps || []).includes(a.id)) { b.deps = b.deps.filter(d => d !== a.id); toast(`disconnected ${a.name} → ${b.name}`); renderBuild(); return; }
    if ((a.deps || []).includes(b.id)) { a.deps = a.deps.filter(d => d !== b.id); toast(`disconnected ${b.name} → ${a.name}`); renderBuild(); return; }
    const li = (w.loops || []).findIndex(l => (l.from === a.id && l.to === b.id) || (l.from === b.id && l.to === a.id));
    if (li >= 0) { w.loops.splice(li, 1); toast("loop removed"); renderBuild(); return; }
    if (reachesVia(w, a.id, b.id)) {
      // Backward wire (target is upstream) — that's a loop-back.
      w.loops.push({ from: a.id, to: b.id, maxPasses: 8, breakAgent: a.agent || "Claude", breakCondition: "", breakCommand: "" });
      toast(`↻ loop: after ${a.name}, go back to ${b.name} — set its break condition below`, "ok", 5000);
    } else {
      b.deps = [...(b.deps || []), a.id];
      toast(`connected ${a.name} → ${b.name}`, "ok");
    }
    renderBuild();
  };
  buildForm.querySelectorAll(".cnode").forEach(node => {
    const id = +node.dataset.node;
    const s = w.steps.find(x => x.id === id);
    if (!s) return;
    let drag = null;
    node.onpointerdown = e => {
      if (e.target.closest("[data-link],[data-port],[data-nopt]")) return;
      drag = { sx: e.clientX, sy: e.clientY, ox: s.x, oy: s.y, moved: false };
      node.setPointerCapture(e.pointerId);
    };
    node.onpointermove = e => {
      if (!drag) return;
      const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
      if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
      if (!drag.moved) return;
      s.x = Math.max(0, drag.ox + dx); s.y = Math.max(0, drag.oy + dy);
      node.style.left = s.x + "px"; node.style.top = s.y + "px";
      const wires = document.getElementById("wires");
      if (wires) {
        // The canvas extent grows with the graph — drag past the edge and it
        // scrolls after you; the viewport itself is resizable by its handle.
        const needW = s.x + CN_W + 60, needH = s.y + CN_H + 60;
        if (needW > +wires.getAttribute("width")) { wires.setAttribute("width", needW); wires.style.width = needW + "px"; }
        if (needH > +wires.getAttribute("height")) { wires.setAttribute("height", needH); wires.style.height = needH + "px"; }
        wires.innerHTML = renderWires(w);
      }
    };
    node.onpointerup = e => {
      if (e.target.closest("[data-link],[data-port],[data-nopt]")) { drag = null; return; }
      const moved = drag && drag.moved; drag = null;
      if (moved) { renderBuild(); return; }
      if (w._connectFrom != null && w._connectFrom !== id) { completeConnect(w._connectFrom, id); return; }
      if (w._connectFrom === id) { delete w._connectFrom; renderBuild(); return; }
      w._selected = id; renderBuild();
    };
    // Hover a step → its own wires light up, the rest dim: in a dense fan-in
    // graph you can actually SEE what a node is connected to.
    node.onmouseenter = () => {
      document.querySelectorAll("#wires [data-edge]").forEach(p => {
        const [f, t] = p.dataset.edge.split("-").map(Number);
        if (f === id || t === id) { p.style.stroke = "var(--accent)"; p.style.strokeWidth = "2.2"; }
        else p.style.opacity = ".18";
      });
      document.querySelectorAll("#wires [data-loopedge]").forEach(p => {
        const l = (w.loops || [])[+p.dataset.loopedge];
        if (l && (l.from === id || l.to === id)) p.style.strokeWidth = "2.2";
        else p.style.opacity = ".18";
      });
    };
    node.onmouseleave = () => {
      document.querySelectorAll("#wires path").forEach(p => { p.style.stroke = ""; p.style.strokeWidth = ""; p.style.opacity = ""; });
    };
    node.querySelector("[data-link]").onclick = e => {
      e.stopPropagation();
      if (w._connectFrom != null && w._connectFrom !== id) { completeConnect(w._connectFrom, id); return; }
      w._connectFrom = w._connectFrom === id ? undefined : id;
      if (w._connectFrom === undefined) delete w._connectFrom;
      renderBuild();
    };
    const nopt = node.querySelector("[data-nopt]");
    if (nopt) nopt.onclick = e => { e.stopPropagation(); optimizeStep(w, s, nopt); };
    // Drag from the ● port onto another step = wire it (backward = loop)
    const port = node.querySelector("[data-port]");
    port.onpointerdown = e => {
      e.stopPropagation();
      port.setPointerCapture(e.pointerId);
      const wires = document.getElementById("wires");
      const cv = document.getElementById("canvas");
      const temp = document.createElementNS("http://www.w3.org/2000/svg", "path");
      temp.setAttribute("stroke", "var(--run)"); temp.setAttribute("stroke-width", "1.6");
      temp.setAttribute("fill", "none"); temp.setAttribute("stroke-dasharray", "5 4");
      wires.appendChild(temp);
      const x1 = s.x + CN_W / 2, y1 = s.y + CN_H;
      port.onpointermove = ev => {
        const r = cv.getBoundingClientRect();
        const x2 = ev.clientX - r.left + cv.scrollLeft, y2 = ev.clientY - r.top + cv.scrollTop;
        temp.setAttribute("d", `M${x1},${y1} C${x1},${y1 + 30} ${x2},${y2 - 30} ${x2},${y2}`);
      };
      port.onpointerup = ev => {
        port.onpointermove = null; port.onpointerup = null;
        temp.remove();
        port.releasePointerCapture(ev.pointerId);
        const hit = document.elementFromPoint(ev.clientX, ev.clientY);
        const target = hit && hit.closest(".cnode");
        if (target && +target.dataset.node !== id) completeConnect(id, +target.dataset.node);
      };
    };
  });

  // Click a wire to remove it
  buildForm.querySelectorAll("[data-edge]").forEach(p => p.onclick = () => {
    const [from, to] = p.dataset.edge.split("-").map(Number);
    const t = w.steps.find(x => x.id === to);
    if (t) { t.deps = (t.deps || []).filter(d => d !== from); toast("disconnected"); renderBuild(); }
  });
  buildForm.querySelectorAll("[data-loopedge]").forEach(p => p.onclick = () => {
    w.loops.splice(+p.dataset.loopedge, 1); toast("loop removed"); renderBuild();
  });

  const tidy = document.getElementById("tidyBtn");
  if (tidy) tidy.onclick = () => { tidyLayout(w); renderBuild(); };

  // Keyboard: Esc cancels connecting; Delete removes the selected step
  document.onkeydown = e => {
    const typing = /INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || "");
    if ((e.metaKey || e.ctrlKey) && (e.key === "z" || e.key === "Z") && !typing && view === "build") {
      e.preventDefault(); timeTravel(e.shiftKey ? 1 : -1); return;
    }
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter" && view === "build") {
      e.preventDefault(); launchChecked(w); return;
    }
    if (!typing && !e.metaKey && !e.ctrlKey && ["1", "2", "3"].includes(e.key)) {
      showView(["build", "runs", "schedules"][+e.key - 1]); return;
    }
    if (e.key === "Escape" && w._connectFrom != null) { delete w._connectFrom; renderBuild(); }
    else if ((e.key === "Delete" || e.key === "Backspace") && !typing && w._selected != null && view === "build") {
      const id = w._selected;
      w.steps = w.steps.filter(x => x.id !== id);
      pruneDeps(w); delete w._selected;
      if (!w.steps.length) w.steps.push({ id: w.nextId++, name: "Step 1", agent: "Claude", prompt: "", deps: [], x: 30, y: 24 });
      renderBuild();
    }
  };

  // Loops list
  buildForm.querySelectorAll("[data-loop]").forEach(card => {
    const l = (w.loops || [])[+card.dataset.loop];
    if (!l) return;
    card.querySelectorAll("[data-lk]").forEach(el => el.onchange = () => {
      const k = el.dataset.lk;
      l[k] = (k === "from" || k === "to") ? +el.value : k === "maxPasses" ? Math.max(1, +el.value || 1) : el.value;
      if (k === "from" && !(l.from !== l.to && reachesVia(w, l.from, l.to))) {
        // the new source invalidated the target — snap to a real ancestor
        const s = w.steps.find(x => x.id === l.from);
        l.to = (s && (s.deps || [])[0]) || l.to;
      }
      if (k === "from" || k === "to") renderBuild();
    });
  });
  buildForm.querySelectorAll("[data-lbreak]").forEach(b => b.onclick = async () => {
    const l = (w.loops || [])[+b.dataset.lbreak];
    if (!l) return;
    const inScope = w.steps.filter(s => (s.id === l.to || reachesVia(w, s.id, l.to)) && (s.id === l.from || reachesVia(w, l.from, s.id)));
    if (!inScope.length) { toast("wire the loop's steps first", "err"); return; }
    // Feed the literal sub-graph: execution order, in-loop wiring, endpoints,
    // and the frozen outside inputs — the stop signal is designed from it.
    const level = computeDepth(w);
    inScope.sort((a, b) => (level[a.id] || 0) - (level[b.id] || 0));
    const scopeIds = new Set(inScope.map(s => s.id));
    const nm = id => (w.steps.find(x => x.id === id) || {}).name || ("Step " + id);
    const frozen = [...new Set(inScope.flatMap(s => (s.deps || []).filter(d => !scopeIds.has(d))))].map(nm);
    try {
      const data = await aiTask("breaks",
        { loop: { max_passes: l.maxPasses, restart_target: nm(l.to), feedback_source: nm(l.from), current_command: l.breakCommand || "", current_condition: l.breakCondition || "" },
          steps: inScope.map(s => ({ name: s.name, waits_for: (s.deps || []).filter(d => scopeIds.has(d)).map(nm), prompt: s.prompt, output: s.schema || "" })),
          frozen_inputs: frozen,
          task: w.tasks, workdir: w.workdir, agent: assistAgent(), binary: settings.binary },
        "Designing this loop's stop from its sub-graph");
      if (data.break_command) { l.breakCommand = data.break_command; l.breakCondition = ""; l.breakAgent = ""; }
      else { l.breakCondition = data.break_condition; l.breakCommand = ""; l.breakAgent = l.breakAgent || (AGENTS.includes("Claude") ? "Claude" : AGENTS[0]); }
      toast(data.break_command ? "✦ deterministic gate proposed: " + data.break_command : "✦ judge condition proposed — review it", "ok", 6000);
      renderBuild();
    } catch (e) { aiFail(e, "break design"); }
  });
  buildForm.querySelectorAll("[data-delloop]").forEach(b => b.onclick = () => { w.loops.splice(+b.dataset.delloop, 1); renderBuild(); });
  document.getElementById("addLoop").onclick = () => {
    // A loop only exists between connected steps: pick the deepest step that
    // has an upstream, looping back to its dependency. No wiring = no loop.
    const level = computeDepth(w);
    const candidates = w.steps.filter(s => (s.deps || []).length).sort((a, b) => (level[b.id] || 0) - (level[a.id] || 0));
    if (!candidates.length) { toast("wire some steps first — a loop re-runs a connected path, so it needs at least one dependency arrow", "err", 6000); return; }
    const from = candidates[0];
    w.loops.push({ from: from.id, to: from.deps[0], maxPasses: 8, breakAgent: "Claude", breakCondition: "", breakCommand: "" });
    renderBuild();
  };
}

/* ---------------- serialize (steps -> engine graph) ---------------- */
function serializeGraph(w) {
  migrateLoops(w); pruneDeps(w); ensurePositions(w);
  const level = computeDepth(w);
  const maxLv = Math.max(0, ...w.steps.map(s => level[s.id] || 0));
  const ordered = [...w.steps].sort((a, b) => (level[a.id] || 0) - (level[b.id] || 0));
  const nodes = ordered.map(s => {
    const n = { id: s.id, name: s.name, prompt: s.prompt, replicas: 1,
                pos: [Math.max(0, Math.round(s.x / 40)), Math.max(0, Math.round(s.y / 40))],
                level: level[s.id] || 0 };
    if (s.code) { n.command = s.prompt; n.prompt = ""; }
    else {
      n.agents = [s.agent];
      if ((s.model || "").trim()) n.model = s.model.trim();
      if ((s.effort || "").trim()) n.effort = s.effort.trim();
      if (s.fresh && (s.deps || []).length) n.fresh = true;
      if (s.raw) n.raw = true;
    }
    if ((s.schema || "").trim() && !s.raw) n.schema = s.schema.trim();
    if ((s.inputSchema || "").trim() && !s.raw) n.input_schema = s.inputSchema.trim();
    if (s.gate && (level[s.id] || 0) < maxLv) n.gate = true;
    return n;
  });
  // Edges = the depends-on sets (kept acyclic at edit time: a backward wire
  // becomes a loop instead). No deps = independent root; fan-in/out free.
  const edges = [];
  ordered.forEach(s => (s.deps || []).forEach(d => edges.push({ from: d, to: s.id, scatter: false })));
  const loops = (w.loops || []).map(l => ({ from: l.from, to: l.to, count: l.maxPasses || 8, breakAgent: l.breakAgent || "", breakCondition: l.breakCondition || "", breakCommand: l.breakCommand || "" }));
  return { nodes, edges, loops };
}
function graphToWf(name, g) {
  // Topologically order nodes (Kahn) so the step list is a valid order for
  // any DAG; each step's depends-on set comes straight from the edges.
  const nodes = (g.nodes || []).slice(), byId = {}; nodes.forEach(n => byId[n.id] = n);
  const indeg = {}, out = {}; nodes.forEach(n => { indeg[n.id] = 0; out[n.id] = []; });
  (g.edges || []).forEach(e => { if (indeg[e.to] != null && out[e.from]) { indeg[e.to]++; out[e.from].push(e.to); } });
  const queue = nodes.filter(n => indeg[n.id] === 0).map(n => n.id), ordered = [], seen = new Set();
  while (queue.length) { const id = queue.shift(); if (seen.has(id)) continue; seen.add(id); ordered.push(byId[id]); out[id].forEach(t => { if (--indeg[t] === 0) queue.push(t); }); }
  nodes.forEach(n => { if (!seen.has(n.id)) ordered.push(n); });
  const depsOf = {}; nodes.forEach(n => depsOf[n.id] = []);
  (g.edges || []).forEach(e => { if (depsOf[e.to]) depsOf[e.to].push(e.from); });
  // Level = longest-path depth from the roots (classic DAG layering).
  const level = {};
  const depth = id => { if (level[id] != null) return level[id]; level[id] = 0; const ds = depsOf[id] || []; if (ds.length) level[id] = 1 + Math.max(...ds.map(depth)); return level[id]; };
  nodes.forEach(n => depth(n.id));
  // Canvas coordinates: reuse saved pos when it looks like canvas pixels/40,
  // else lay out by depth (TUI-authored files use small grid coords).
  const maxPos = Math.max(0, ...nodes.map(n => Math.max(...((n.pos || [0, 0])))));
  const rowsSeen = {};
  const steps = ordered.map(n => {
    const lv = level[n.id] || 0;
    let x, y;
    if (maxPos > 12 && n.pos) { x = n.pos[0] * 40; y = n.pos[1] * 40; }
    else { rowsSeen[lv] = rowsSeen[lv] || 0; x = 30 + rowsSeen[lv] * 200; y = 24 + lv * 110; rowsSeen[lv]++; }
    return { id: n.id, name: n.name || "Step", agent: (n.agents && n.agents[0]) || "Claude", prompt: (n.command || n.prompt || ""), code: !!(n.command || "").trim(), model: n.model || "", effort: n.effort || "", fresh: !!n.fresh, raw: !!n.raw, schema: n.schema || "", inputSchema: n.input_schema || "", gate: !!n.gate, deps: depsOf[n.id] || [], x, y };
  });
  const loops = (g.loops || []).map(lp => ({ from: lp.from, to: lp.to, breakAgent: lp.breakAgent || "Claude", breakCondition: lp.breakCondition || "", breakCommand: lp.breakCommand || "", maxPasses: lp.count || 8 }));
  return { name, workdir: "", allowEdits: true, tasks: "", maxCalls: "", nextId: Math.max(0, ...steps.map(s => s.id)) + 1, steps, loops };
}

/* ---------------- save / open / settings ---------------- */
function saveWorkflow() {
  const def = (wf().name || "workflow").replace(/\s+/g, "_");
  showModal(`<label>Save workflow as</label><input id="svName" value="${esc(def)}">
    <div style="margin-top:12px;display:flex;justify-content:flex-end;gap:8px"><button id="svCancel">Cancel</button><button class="primary2" id="svOk">Save</button></div>`, box => {
    const inp = box.querySelector("#svName"); inp.focus(); inp.select();
    const go = async () => { const name = inp.value.trim(); if (!name) { toast("Enter a name", "err"); return; }
      let r; try { r = await fetch("/pipeline", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name, graph: serializeGraph(wf()) }) }); } catch (e) { toast("Cannot reach bridge: " + e, "err"); return; }
      const j = await r.json(); closeModal(); toast(r.ok ? "Saved: " + j.saved : "Error: " + (j.error || r.status), r.ok ? "ok" : "err"); };
    box.querySelector("#svCancel").onclick = closeModal; box.querySelector("#svOk").onclick = go;
    inp.onkeydown = e => { if (e.key === "Enter") go(); };
  });
}
async function openWorkflow() {
  let pipelines = []; try { pipelines = (await (await fetch("/pipelines")).json()).pipelines || []; } catch (e) { toast("Cannot reach bridge", "err"); return; }
  if (!pipelines.length) { toast("No saved pipelines yet.", "run"); return; }
  showModal(`<label>Open pipeline</label>${pipelines.map(p => `<div><button style="width:100%;margin:3px 0;text-align:left" data-p="${esc(p)}">${esc(p)}</button></div>`).join("")}<div style="margin-top:10px"><button id="mCancel">Cancel</button></div>`, box => {
    box.querySelectorAll("[data-p]").forEach(b => b.onclick = async () => { const j = await (await fetch("/pipeline?name=" + encodeURIComponent(b.dataset.p))).json(); if (j.graph) { wfs.push(graphToWf(j.name, j.graph)); active = wfs.length - 1; closeModal(); showView("build"); renderAll(); } else toast("Open error: " + (j.error || ""), "err"); });
    box.querySelector("#mCancel").onclick = closeModal;
  });
}
document.getElementById("btnSettings").onclick = () => {
  showModal(`<label>Global settings</label>
    <label>Parallelism (max concurrent tasks)</label><input id="stPar" type="number" min="1" value="${settings.parallel}">
    <label>Binary path (blank = auto-detect)</label><input id="stBin" placeholder="target/release/houseofagents" value="${esc(settings.binary)}">

    b.style.borderColor = "var(--run)"; b.style.color = "var(--run)";
    b.onclick = () => showView("schedules");
  } else {
    b.textContent = "Schedule…"; b.title = "Run THIS workflow on a schedule until a gate passes";
    b.style.borderColor = ""; b.style.color = "";
    b.onclick = openScheduleForm;
  }
}
setInterval(refreshSchedCache, 10000);
refreshSchedCache();
function fmtAgo(t) { const s = (Date.now() / 1000 - t) | 0; return s < 60 ? s + "s ago" : s < 3600 ? (s / 60 | 0) + "m ago" : s < 86400 ? (s / 3600 | 0) + "h ago" : (s / 86400 | 0) + "d ago"; }
function renderRunList() {
  const host = document.getElementById("runList");
  if (!host) return;
  const live = [...runs].reverse().map(r => {
    const done = r.steps.filter(s => s.state === "done").length;
    return `<div class="runrow${(selectedRunId || (runs[runs.length-1]||{}).id) === r.id ? " sel" : ""}" data-run="${r.id}">
      <div class="rr1"><span class="dot ${r.status === "completed" ? "completed" : r.status}"></span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.wfName)}</span></div>
      <div class="rr2"><span>${r.status === "running" ? "running" : r.status === "gated" ? "⏸ needs you" : esc(r.status)}</span><span>${done}/${r.steps.length} steps</span></div>
    </div>`;
  }).join("");
  const disk = diskRuns.length ? `<div style="font-size:10px;font-weight:650;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:14px 0 6px">Earlier · on disk</div>` +
    diskRuns.map(r => `<div class="runrow" data-disk="${esc(r.path)}">
      <div class="rr1"><span class="dot ${r.status === "ok" ? "completed" : "error"}"></span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.name)}</span></div>
      <div class="rr2"><span>${esc(r.date)}</span><span>${fmtAgo(r.mtime)}</span></div>
    </div>`).join("") : "";
  host.innerHTML = live + disk;
  host.querySelectorAll("[data-run]").forEach(el => el.onclick = () => { selectedRunId = el.dataset.run; const r = runs.find(x => x.id === selectedRunId); if (r) mountRun(r); renderRunList(); });
  host.querySelectorAll("[data-disk]").forEach(el => el.onclick = () => { selectedRunId = "disk"; mountDiskRun(el.dataset.disk); renderRunList(); });
}
async function loadRunHistory() {
  try { diskRuns = ((await (await fetch("/runs-history")).json()).runs || []); renderRunList(); } catch { }
}
function mountRun(run) {
  const det = document.getElementById("runDetail");
  if (!det) return;
  mountedRunId = run.id; selectedRunId = run.id;
  ensureRunCard(run);
  det.innerHTML = "";
  det.appendChild(run.el);
  updateRun(run);
}
async function mountDiskRun(dir) {
  const det = document.getElementById("runDetail");
  mountedRunId = "disk:" + dir;
  det.innerHTML = `<div class="card"><div class="h"><span>${esc(dir.split("/").pop())}</span><span class="badge2 b-pend">on disk</span></div><div class="meta" style="padding-top:8px">loading…</div></div>`;
  try {
    const d = await (await fetch("/run-artifacts?dir=" + encodeURIComponent(dir))).json();
    const ins = {}; (d.inputs || []).forEach(f => ins[f.name] = f.content);
    const rows = (d.files || []).filter(f => f.name !== "prompt.md").map(f => `
      <details><summary style="padding:6px 12px;font-size:12px;cursor:pointer"><b>${esc(f.name.replace(/\.md$/, "").replace(/_b\d+.*/, ""))}</b></summary>
      <div style="padding:0 12px 10px">${ins[f.name] ? `<details style="margin-bottom:6px"><summary style="font-size:10.5px;color:var(--muted);cursor:pointer">→ sent</summary><pre style="max-height:200px;overflow:auto;font-size:11px;white-space:pre-wrap;background:var(--well);border:1px solid var(--edge);border-radius:8px;padding:8px;margin:4px 0 0">${esc(ins[f.name])}</pre></details>` : ""}
      <pre style="max-height:280px;overflow:auto;font-size:11.5px;white-space:pre-wrap;background:var(--well);border:1px solid var(--edge);border-radius:8px;padding:8px;margin:0">${esc(f.content)}</pre></div></details>`).join("");
    det.innerHTML = `<div class="card"><div class="h"><span>${esc(dir.split("/").pop())}</span><span class="badge2 b-pend">on disk</span></div>
      <div style="padding:8px 12px 2px;font-size:10.5px;font-weight:650;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)">Step results</div>${rows}
      <div class="meta" style="padding-top:6px;word-break:break-all">run dir: ${esc(dir)}</div></div>`;
  } catch (e) { det.innerHTML = `<div class="empty">could not load: ${esc(String(e))}</div>`; }
}

/* ---------------- schedules view ---------------- */
let schedTimer = null, schedSeen = {};
function stopSchedPoll() { if (schedTimer) { clearInterval(schedTimer); schedTimer = null; } }
function openScheduleForm() {
  const w = wf();
  showModal(`<label>Schedule: ${esc(w.name || "workflow")}</label>
    <label>Run every (minutes)</label><input id="scInt" type="number" min="1" value="5">
    <label>Max runs (safety cap)</label><input id="scMax" type="number" min="1" value="20">
    <label>Gate — how to decide when to stop (blank = never; stops at max runs)</label>
    <div class="radios" style="margin:2px 0 4px"><label><input type="radio" name="scKind" value="command" checked>Shell command</label><label><input type="radio" name="scKind" value="agent">Agent judges</label></div>
    <div id="scCmdBox">
      <textarea id="scGate" rows="2" placeholder="e.g.  gh pr checks 123   |   make test   |   test -f done.flag"></textarea>
      <div style="color:var(--muted);font-size:10px;margin-top:3px">Any shell command; <b>exit 0 = done/stop</b>, non-zero = run. Nothing integration-specific is built in.</div>
    </div>
    <div id="scAgentBox" style="display:none">
      <label>Judge agent</label><select id="scAgent">${AGENTS.map(a => `<option>${a}</option>`).join("")}</select>
      <label>Condition (the agent replies DONE/CONTINUE)</label>
      <textarea id="scGateP" rows="2" placeholder="e.g. the PR's CI is green and there are no unresolved review comments"></textarea>
    </div>
    <div style="margin-top:12px;display:flex;justify-content:flex-end;gap:8px"><button id="scCancel">Cancel</button><button class="primary2" id="scStart">Start</button></div>`, box => {
    box.querySelector("#scCancel").onclick = closeModal;
    const sync = () => { const agent = box.querySelector("input[name=scKind]:checked").value === "agent"; box.querySelector("#scCmdBox").style.display = agent ? "none" : "block"; box.querySelector("#scAgentBox").style.display = agent ? "block" : "none"; };
    box.querySelectorAll("input[name=scKind]").forEach(r => r.onchange = sync);
    box.querySelector("#scStart").onclick = async () => {
      const kind = box.querySelector("input[name=scKind]:checked").value;
      const body = { workflow: { name: w.name, workdir: w.workdir, allowEdits: w.allowEdits, memory: w.memory, maxCalls: w.maxCalls || null, tasks: w.tasks, graph: serializeGraph(w) }, binary: settings.binary, interval_sec: Math.max(1, +box.querySelector("#scInt").value) * 60, max_runs: Math.max(1, +box.querySelector("#scMax").value), gate_kind: kind, gate: kind === "agent" ? box.querySelector("#scGateP").value.trim() : box.querySelector("#scGate").value.trim(), gate_agent: box.querySelector("#scAgent").value };
      let r; try { r = await fetch("/schedules", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }); } catch (e) { toast("Cannot reach bridge", "err"); return; }
      const j = await r.json(); if (r.ok) { closeModal(); toast(`scheduled: ${w.name || "workflow"}`, "run"); showView("schedules"); } else toast("Schedule error: " + (j.error || r.status), "err");
    };
  });
}
async function renderSchedules() {
  let list = []; try { list = (await (await fetch("/schedules")).json()).schedules || []; } catch (_) { }
  list.forEach(s => { if (schedSeen[s.id] && schedSeen[s.id] !== s.state && ["converged", "capped", "error", "stopped"].includes(s.state)) toast(`${s.name}: ${s.state}`, s.state === "converged" ? "ok" : s.state === "error" ? "err" : "run"); schedSeen[s.id] = s.state; });
  if (view !== "schedules") return;
  const badge = st => `<span class="badge2 ${st === "converged" ? "b-ok" : st === "error" || st === "capped" ? "b-err" : st === "running" ? "b-run" : "b-pend"}">${st}</span>`;
  const fmtIv = s => s >= 3600 ? (s / 3600 | 0) + "h" : s >= 60 ? (s / 60 | 0) + "m" : s + "s";
  const _openLogs = {};
  document.querySelectorAll("#schedBody details[data-sid]").forEach(d => { if (d.open) _openLogs[d.dataset.sid] = d.querySelector(".log")?.scrollTop ?? 0; });
  document.getElementById("schedBody").innerHTML =
    (list.length ? list.map(s => `<div class="card">
      <div class="h"><span style="display:flex;gap:8px;align-items:center"><span class="dot ${s.state === "running" ? "running" : s.state === "converged" ? "completed" : s.state === "error" || s.state === "capped" ? "error" : "pend"}"></span><b>${esc(s.name)}</b> ${badge(s.state)}</span>
        <span style="display:flex;gap:6px;align-items:center">
          <button data-now="${s.id}" title="run this schedule's workflow once, right now (shows up in Runs)" style="padding:2px 9px;font-size:11px">▶ once</button>
          ${["running", "pending"].includes(s.state) ? `<button data-stop="${s.id}" style="padding:2px 9px;font-size:11px">Stop</button>` : `<button data-del="${s.id}" class="danger" style="padding:2px 9px;font-size:11px">Delete</button>`}
        </span></div>
      <div style="display:flex;gap:22px;flex-wrap:wrap;padding:9px 12px;font-size:12px">
        <span><span style="color:var(--muted)">cadence</span><br>every ${fmtIv(s.interval_sec)} · run ${s.runs_done}/${s.max_runs}</span>
        <span><span style="color:var(--muted)">next check</span><br>${s.state !== "running" ? "—" : s.next_in != null ? "in ~" + fmtIv(s.next_in) : "now (running the workflow)"}</span>
        <span><span style="color:var(--muted)">gate — stops when</span><br>${s.gate ? (s.gate_kind === "agent" ? `${esc(s.gate_agent || "agent")} judges: “${esc(s.gate.slice(0, 70))}”` : `<code style="font-size:11px">${esc(s.gate.slice(0, 70))}</code> exits 0${s.last_gate_exit != null ? ` · last exit ${s.last_gate_exit}` : ""}`) : "never (runs to the cap)"}</span>
        <span><span style="color:var(--muted)">workflow</span><br>${esc((s.steps || []).join(" → ").slice(0, 80) || "—")}</span>
      </div>
      <details data-sid="${s.id}"><summary style="padding:5px 12px;color:var(--accent);font-size:11px;cursor:pointer">activity</summary><div class="log">${esc((s.log || []).join("\n"))}</div></details>
    </div>`).join("") : `<div class="empty">No schedules.<br><span style="font-size:12px">Open a workflow in Build and click Schedule… — it re-runs on a cadence until its gate passes.</span></div>`);
  document.querySelectorAll("#schedBody details[data-sid]").forEach(d => { if (d.dataset.sid in _openLogs) { d.open = true; const l = d.querySelector(".log"); if (l) l.scrollTop = _openLogs[d.dataset.sid]; } });
  document.querySelectorAll("[data-stop]").forEach(b => b.onclick = async () => { await fetch(`/schedules/${b.dataset.stop}/stop`, { method: "POST" }); renderSchedules(); });
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => { await fetch(`/schedules/${b.dataset.del}/delete`, { method: "POST" }); renderSchedules(); });
  document.querySelectorAll("[data-now]").forEach(b => b.onclick = async () => {
    const r = await fetch(`/schedules/${b.dataset.now}/run-now`, { method: "POST" });
    const d = await r.json();
    if (!r.ok) { toast(d.error || "failed", "err"); return; }
    toast("▶ launched — watch it in Runs", "ok");
    reattachRuns();
  });
}

renderWfbar(); showView(["build","runs","schedules"].includes(new URLSearchParams(location.search).get("view")) ? new URLSearchParams(location.search).get("view") : "build");
